<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full-Stack Quest</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/styles/base.css" />
  <link rel="stylesheet" href="src/styles/week-theme.css" />
  <link rel="stylesheet" href="src/styles/course-map.css" />
  <link rel="stylesheet" href="src/styles/lesson.css" />
  <link rel="stylesheet" href="src/styles/markdown-lab.css" />
  <link rel="stylesheet" href="src/styles/sidebar.css" />
  <link rel="stylesheet" href="src/styles/responsive.css" />
</head>
<body>
  <header class="topbar-wrap"><div class="page topbar">
    <nav class="nav-links" aria-label="Primary navigation">
      <button class="nav-item active" type="button" data-page="learn" aria-current="page"><div class="nav-icon"><img src="assets/icons/code_book_transparent.webp" alt="" /></div><span>LEARN</span></button>
      <button class="nav-item" type="button" data-page="shop"><div class="nav-icon"><img src="assets/icons/shop_transparent_clean.webp" alt="" /></div><span>SHOP</span></button>
      <button class="nav-item" type="button" data-page="more"><div class="nav-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#fff" stroke="#a0a0a0" stroke-width="2.5"/><circle cx="10" cy="16" r="2" fill="#a0a0a0"/><circle cx="16" cy="16" r="2" fill="#a0a0a0"/><circle cx="22" cy="16" r="2" fill="#a0a0a0"/></svg></div><span>MORE</span></button>
    </nav>
    <div class="topbar-actions">
      <img class="flag" src="assets/icons/palestinian_flag_transparent.webp" alt="Palestinian flag" />
      <div class="status" role="img" aria-label="Rank 1 of 16" data-rank-status><div class="status-icon"><svg viewBox="0 0 30 32" aria-hidden="true"><path d="M3 8l7 5 5-8 5 8 7-5-2 18H5z" fill="#ffc800"/><path d="M5 10l5 3 5-8 5 8 5-3" fill="none" stroke="#ff9f1c" stroke-width="2" stroke-linejoin="round"/></svg></div><span data-status-value>1</span></div>
      <div class="status" role="img" aria-label="0-day streak" data-streak-status><div class="status-icon"><img src="assets/icons/flame_transparent.webp" alt="" /></div><span data-status-value>0</span></div>
      <div class="status" role="img" aria-label="6 gems"><div class="status-icon"><img src="assets/icons/red_gem_transparent.webp" alt="" /></div><span>6</span></div>
      <button class="overview-trigger" type="button" aria-label="Open game overview" aria-controls="game-overview" aria-expanded="false"></button>
      <div class="avatar" role="img" aria-label="Profile"><svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="12" r="7" fill="#fff"/><path d="M5 31c1-7 5-11 12-11s11 4 12 11" fill="#fff"/></svg></div>
    </div>
  </div></header>
  <div class="overview-backdrop" aria-hidden="true"></div>
  <main class="page">
    <section class="column" aria-labelledby="learning-path-title">
      <h1 class="visually-hidden" id="learning-path-title">Full-Stack Quest daily learning path</h1>
      <div class="course-units"></div>
    </section>
    <aside class="sidebar" id="game-overview" aria-label="Game overview">
      <button class="modal-close" type="button" aria-label="Close game overview">×</button>
      <div class="league">
        <div class="game-header">
          <div class="game-title-row">
            <div class="game-title"><span>CODE LEAGUE</span><span class="info-icon" role="img" aria-label="League information">i</span></div>
            <span class="week-label" data-rank-position>RANK 1 OF 16</span>
          </div>
          <div class="league-rank" aria-label="Rank 1 of 16: Bronze" data-rank-card>
            <div class="rank-badge" aria-hidden="true">
              <img src="assets/icons/ranks/bronze.webp" alt="" />
              <span class="rank-badge-number" data-rank-number>1</span>
            </div>
            <div class="rank-details">
              <div class="rank-name" data-rank-name>Bronze Rank</div>
              <div class="rank-progress" role="progressbar" aria-label="0 of 800 XP toward Copper Rank" aria-valuemin="0" aria-valuemax="800" aria-valuenow="0" data-rank-progress>
                <div class="rank-progress-fill" style="--progress:0%" data-progress-fill></div><span class="progress-count" data-progress-count>0/800 XP</span>
              </div>
            </div>
          </div>
        </div>
        <section class="challenges" aria-labelledby="challenges-title">
          <h2 class="challenges-title" id="challenges-title">CHALLENGES</h2>
          <div class="challenge-list">
            <div class="challenge challenge--book">
              <div class="challenge-icon" aria-hidden="true"><img src="assets/icons/code_book_transparent.webp" alt="" /></div>
              <div><div class="challenge-name">Course progress</div><div class="challenge-progress" role="progressbar" aria-label="0 of 112 lessons completed" aria-valuemin="0" aria-valuemax="112" aria-valuenow="0" data-course-progress><span class="challenge-progress-fill" style="--progress:0%" data-progress-fill></span><span class="progress-count" data-progress-count>0/112</span></div></div>
              <div class="challenge-reward" data-course-total>0 DONE</div>
            </div>
            <div class="challenge challenge--flame">
              <div class="challenge-icon" aria-hidden="true"><img src="assets/icons/flame_transparent.webp" alt="" /></div>
              <div><div class="challenge-name">Daily streak</div><div class="challenge-progress" role="progressbar" aria-label="Current daily streak: 0 days; longest streak: 0 days" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0" data-streak-progress><span class="challenge-progress-fill" style="--progress:0%" data-progress-fill></span><span class="progress-count" data-progress-count>0 DAYS</span></div></div>
              <div class="challenge-reward" data-streak-best>BEST 0</div>
            </div>
            <div class="challenge challenge--gem">
              <div class="challenge-icon" aria-hidden="true"><img src="assets/icons/red_gem_transparent.webp" alt="" /></div>
              <div><div class="challenge-name">XP earned today</div><div class="challenge-progress" role="progressbar" aria-label="0 XP earned today" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-daily-xp-progress><span class="challenge-progress-fill" style="--progress:0%" data-progress-fill></span><span class="progress-count" data-progress-count>0/100</span></div></div>
              <div class="challenge-reward" data-daily-xp-total>0 XP</div>
            </div>
          </div>
        </section>
        <div class="sidebar-status" data-total-xp>0 XP TOTAL</div>
      </div>
    </aside>
    <section class="coming-soon" aria-live="polite">
      <div class="coming-soon-card">
        <h1 class="coming-soon-title">COMING SOON</h1>
        <p class="coming-soon-copy">This page is still being prepared.</p>
        <div class="more-tabs" hidden>
          <div class="more-tab-list" role="tablist" aria-label="More tools">
            <button class="more-tab" id="ui-lab-tab" type="button" role="tab" aria-selected="true" aria-controls="ui-lab-panel" tabindex="0" data-more-tab="ui-lab">UI LAB</button>
            <button class="more-tab" id="ship-ready-tab" type="button" role="tab" aria-selected="false" aria-controls="ship-ready-panel" tabindex="-1" data-more-tab="ship-ready">SHIP READY</button>
            <button class="more-tab" id="design-system-tab" type="button" role="tab" aria-selected="false" aria-controls="design-system-panel" tabindex="-1" data-more-tab="design-system">DESIGN SYSTEM</button>
          </div>
          <div class="more-tab-panel" id="ui-lab-panel" role="tabpanel" aria-labelledby="ui-lab-tab"></div>
          <div class="more-tab-panel" id="ship-ready-panel" role="tabpanel" aria-labelledby="ship-ready-tab" hidden></div>
          <div class="more-tab-panel" id="design-system-panel" role="tabpanel" aria-labelledby="design-system-tab" hidden></div>
        </div>
      </div>
    </section>
    <section class="lesson-view">
      <div class="lesson-shell">
        <div class="lesson-top">
          <button class="lesson-back" type="button" aria-label="Return to lesson path">&lsaquo;</button>
          <div class="lesson-top-title"><span class="current-view-title">DAY 1</span></div>
          <span class="lesson-status">IN PROGRESS</span>
        </div>
        <div class="lesson-card" id="lesson-content" tabindex="-1"></div>
      </div>
    </section>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
